[project]
name = "prodml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "dvc[s3]",
    "scikit-learn",
    "pandas",
    "pyarrow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "onnxruntime",
    "mlflow>=2.11.1",
    "xgboost>=1.7.0",
    "torch>=2.0.0",
    "skl2onnx>=1.14.0",
    "boto3",
    "botocore"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "httpx",
    "pre-commit"
]

[project.scripts]
prodml-train = "prodml.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
