name: Continuous Training

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      data_version:
        description: 'DVC Data Version / Hash'
        required: false
        default: 'latest'
  repository_dispatch:
    types: [data-drift-detected]

jobs:
  continuous-training:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URL: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure DVC Remote & Pull Data
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          dvc remote modify origin --local password ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          dvc pull

      - name: Run Training Pipeline & Evaluation
        run: |
          python src/prodml/train.py

      - name: Gate Check & Promote to Staging
        run: |
          python scripts/gate_check.py
