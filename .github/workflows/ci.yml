name: CI Pipeline

on:
  push:
    branches: [ main,module-2-tracking-automation ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install ruff black pytest pytest-cov httpx mypy pre-commit

      - name: Code formatting & linting check
        run: |
          python -m ruff check src tests
          python -m black --check src tests

      - name: Debug pytest collection
        run: |
          python -m pytest --collect-only -v tests/test_pipeline.py

      - name: Run tests with pytest & coverage
        run: |
          python -m pytest -v --cov=src/prodml --cov-report=term-missing --cov-fail-under=50

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t prodml-api:ci .